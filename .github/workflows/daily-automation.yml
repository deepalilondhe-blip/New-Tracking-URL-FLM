name: Daily FLM Automation

on:
  schedule:
    # Run everyday at 10:00 AM IST (which is 04:30 UTC)
    - cron: '30 4 * * *'
    # Run everyday at 07:00 PM IST (which is 13:30 UTC)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-automation:
    runs-on: ubuntu-latest
    # One full sequential campaign batch usually takes 45-90 minutes.
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chrome and System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Configure Credentials (.env & Google Service Account)
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMTP_USER_SECRET: ${{ secrets.SMTP_USER }}
          SMTP_PASS_SECRET: ${{ secrets.SMTP_PASS }}
          REPORT_EMAIL_SECRET: ${{ secrets.REPORT_EMAIL_RECIPIENT }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const dotenvContent = process.env.DOTENV_CONTENT || '';
          if (!dotenvContent.trim()) {
            console.error('DOTENV secret is empty.');
            process.exit(1);
          }
          const json = process.env.GOOGLE_SA_JSON || '';
          if (!json.trim()) {
            console.error('GOOGLE_SERVICE_ACCOUNT_JSON secret is empty.');
            process.exit(1);
          }

          const extra = [
            'GOOGLE_SHEET_ID=1rXIg3dMQ4APH3lHLcfWYfP45PnOAKmV9POkoSS3YWxI',
            'GOOGLE_SERVICE_ACCOUNT_FILE=service_account.json',
            'SMTP_HOST=smtp.gmail.com',
            'SMTP_PORT=587',
            'SMTP_SECURE=false'
          ];
          // Only write dedicated SMTP secrets when they actually exist.
          // Empty SMTP_USER= lines would overwrite values already inside DOTENV.
          if (process.env.SMTP_USER_SECRET) extra.push('SMTP_USER=' + process.env.SMTP_USER_SECRET);
          if (process.env.SMTP_PASS_SECRET) extra.push('SMTP_PASS=' + process.env.SMTP_PASS_SECRET);
          if (process.env.REPORT_EMAIL_SECRET) extra.push('REPORT_EMAIL_RECIPIENT=' + process.env.REPORT_EMAIL_SECRET);

          fs.writeFileSync('.env', dotenvContent.replace(/\r\n/g, '\n').trim() + '\n' + extra.join('\n') + '\n');
          fs.writeFileSync('service_account.json', json);
          console.log('Wrote .env and service_account.json');
          EOF

      - name: Verify SMTP from DOTENV
        run: |
          node -e "require('dotenv').config(); if(!process.env.SMTP_USER || !process.env.SMTP_PASS){ console.log('SMTP is not in DOTENV. Campaigns and Google Sheet append will still run. Email report may be skipped.'); process.exit(0);} console.log('SMTP recipient:', process.env.REPORT_EMAIL_RECIPIENT || 'deepali.londhe@magnetoitsolutions.com');"

      - name: Verify Google Sheet append access
        run: node scratch/verify-sheet-access.js

      - name: Execute Daily Verification Campaign
        env:
          CI: true
          HEADLESS: 'true'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node scheduler.js --once --headless

      - name: Send grouped campaign report email
        if: always()
        env:
          CI: true
        continue-on-error: true
        run: node scheduler.js --email-only

      - name: Upload Email Report Preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-email-report
          path: logs/flm-agent-email-today.html
          if-no-files-found: warn
          retention-days: 14
